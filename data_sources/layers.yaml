# simy_city — Service Layers & Dependency Model
# -----------------------------------------------------------------------------
# These are the SimCity-style "systems" a parcel/development draws on. The
# registry tags each data source with the layer(s) it feeds. The dependency
# engine (simy_city/depgraph.py) walks `requires` edges to answer:
#   "If I put USE X on this parcel, what does it need, is it available nearby,
#    and what second-order needs (schools/fire/etc.) does it induce, at what
#    scale?"
#
# Each layer has:
#   provides      what this layer supplies to a development
#   measured_by   which registry source ids quantify supply near a parcel
#   capacity_unit the unit we score headroom in
# -----------------------------------------------------------------------------

layers:
  demand:
    label: Demand / Customers
    provides: rooftops, households, daytime population, spending power
    measured_by: [census_acs5, census_cbp_zbp, lehd_lodes, overture_buildings]
    capacity_unit: households_in_drive_time

  competition:
    label: Competition / Saturation
    provides: existing same-category supply
    measured_by: [osm_overpass, census_cbp_zbp]
    capacity_unit: competitors_in_trade_area

  transportation:
    label: Transportation / Access
    provides: drive-time reach, traffic exposure
    measured_by: [openrouteservice, ntad_roads, osm_overpass]
    capacity_unit: minutes_drive_time

  power:
    label: Power
    provides: electricity capacity & price
    measured_by: [eia_opendata, hifld_power, ercot_grid, nrel_resource]
    capacity_unit: MW_available_at_nearest_substation

  water:
    label: Water & Wastewater
    provides: potable supply, discharge capacity
    measured_by: [epa_sdwis_echo, usgs_nhd_water]
    capacity_unit: MGD_available   # million gallons/day

  broadband:
    label: Broadband
    provides: internet capacity & redundancy
    measured_by: [fcc_bdc]
    capacity_unit: max_advertised_gbps

  education:
    label: Schools
    provides: K-12 capacity
    measured_by: [nces_schools, census_acs5]
    capacity_unit: enrollment_headroom

  health:
    label: Health Care
    provides: hospital/clinic capacity
    measured_by: [hifld_civic, cms_hospitals]
    capacity_unit: beds_per_1000

  safety:
    label: Fire / EMS / Police
    provides: emergency response coverage
    measured_by: [hifld_civic]
    capacity_unit: response_time_minutes

  parcel:
    label: Land / Parcel Feasibility
    provides: buildable land, zoning, hazard constraints
    measured_by: [tcad_parcels, fema_nfhl, usgs_3dep]
    capacity_unit: buildable_acres

  entitlement:
    label: Zoning / Entitlement
    provides: legal permission to build a use at a density
    measured_by: [tcad_parcels]   # land-use code is a weak proxy; true zoning is municipal (a known data gap)
    capacity_unit: allowed_density

  absorption:
    label: Market Absorption (demand-to-build)
    provides: confidence that built homes/space will sell or lease quickly
    measured_by: [census_acs5, bls_qcew, lehd_lodes, census_cbp_zbp]
    capacity_unit: years_of_supply   # lower = hotter market = developers invest

  # ---- IMPACT layers: the *cost of developing* (the "should we?" question) ----
  # Unlike `environment` (which gates whether you *can* build), these measure what
  # building *destroys or emits*. Higher = worse. They give the environmentalist a
  # quantified voice instead of a veto.
  habitat:
    label: Habitat & Biodiversity
    provides: ecological value at risk from development
    measured_by: [usfws_critical_habitat, padus_protected_areas, gbif_biodiversity]
    capacity_unit: habitat_sensitivity   # protected/critical/biodiverse = high

  land_cover:
    label: Land Cover & Impervious Surface
    provides: natural land lost and runoff added by development
    measured_by: [nlcd_landcover, tceq_edwards_aquifer]
    capacity_unit: impervious_increase_pct

  carbon:
    label: Carbon
    provides: emissions from construction, operation, and canopy/soil loss
    measured_by: [nlcd_landcover, eia_opendata]
    capacity_unit: tonnes_CO2e_per_year

  environment:
    label: Environment / Hazards
    provides: flood/terrain/climate constraints
    measured_by: [fema_nfhl, usgs_3dep, usgs_nhd_water]
    capacity_unit: constraint_score

# -----------------------------------------------------------------------------
# Land uses we can "drop" on a parcel, SimCity-style, with their dependency
# edges. `requires` = hard inputs. `induces` = second-order public-service
# demand this use creates, with a rough trigger scale. These thresholds are
# deliberately first-draft, sourced-where-possible, and meant to be refined by
# contributors (each should eventually cite a planning standard).
# -----------------------------------------------------------------------------

land_uses:

  warehouse_club:        # Costco-type
    label: Warehouse Club (Costco-type)
    requires:
      demand:        { min_households_drive_time: 100000, drive_time_min: 15 }
      competition:   { max_same_brand_in_trade_area: 0 }
      transportation: { near_highway_aadt: 40000 }
      parcel:        { min_buildable_acres: 15 }
    induces:
      transportation: { note: "major traffic generator; may require signal/turn-lane upgrades" }
    impacts:            # cost of developing — see stakeholders / "should we?"
      habitat: low
      land_cover: high       # big-box + parking = lots of new impervious surface
      carbon: medium         # construction + ongoing energy + induced car trips
      traffic: high
    notes: >
      Costco's own rule of thumb is a large rooftop base within a short drive and
      a big flat pad. 78738 likely fails the drive-time household count, not income.

  fast_casual:           # Chipotle-type
    label: Fast-Casual Restaurant (Chipotle-type)
    requires:
      demand:        { min_daytime_population: 20000, drive_time_min: 10 }
      transportation: { near_arterial_aadt: 20000 }
      parcel:        { min_buildable_acres: 0.7 }
      # Deliberately no `competition` block, unlike warehouse_club/
      # food_truck_court/ev_charging_hub: those model a fixed nearby demand
      # pool one more entrant just splits (a second Costco, food truck, or
      # charger competes for the same rooftops), so distance from the
      # nearest existing one is the right gate. A fast-casual restaurant
      # instead benefits from co-location — shared drive-thru/parking
      # traffic and cross-shopping between nearby QSR/fast-casual spots is
      # a real commercial-real-estate pattern ("restaurant row"), so being
      # near existing competitors is not a bad sign the way it is for the
      # other three. `reverseSearchSignals` (web/logic.js) reflects this: it
      # gives fast_casual `preferNear` only, no `preferFar`.
    induces: {}
    impacts:
      habitat: low
      land_cover: low
      carbon: low
      traffic: medium
    notes: >
      Drafts off daytime/lunch population and car traffic more than nighttime
      rooftops — hence why an office node or retail anchor matters.

  data_center:
    label: Data Center
    requires:
      power:     { min_MW: 20, prefer_substation_within_km: 5 }
      water:     { min_MGD: 1.0, note: "for evaporative cooling; air-cooled relaxes this" }
      broadband: { min_redundant_fiber_routes: 2, min_gbps: 100 }
      parcel:    { min_buildable_acres: 10, prefer_flood_zone: none }
      environment: { prefer_low_slope: true }
    induces:
      safety:    { trigger: "hazmat/electrical load may raise ESD/fire requirements" }
      power:     { trigger: ">50MW load typically forces transmission upgrade / ERCOT interconnection study" }
    impacts:
      habitat: medium        # large clearing footprint, often on cheaper edge land
      land_cover: high
      carbon: high           # major continuous electricity draw + embodied carbon
      water_stress: high     # evaporative cooling in a drought-prone region
      traffic: low
    notes: >
      The flagship dependency example. Power + water + fiber are the gating
      trio; ERCOT interconnection queue position determines real-world timeline.
      Its high carbon + water impacts make it the sharpest "should we?" case.

  residential_subdivision:
    label: Residential Subdivision (housing-developer lens)
    # `requires` = supply-side feasibility (can it physically/legally be built?)
    requires:
      water:        { min_MGD_per_1000_homes: 0.3 }
      power:        { distribution_capacity: true }
      transportation: { road_access: true }
      parcel:       { min_buildable_acres: 5, prefer_flood_zone: none }
      entitlement:  { zoning_allows_residential: true }
    # `demand_signals` = why a developer chooses to invest *here, now*. A parcel
    # can be perfectly buildable and still sit idle because absorption is weak.
    demand_signals:
      absorption: { max_years_of_supply: 2.0, note: "hot market: homes sell fast" }
      jobs:       { layer: demand, signal: nearby_job_growth }
      # prefer_school_within_km is the one demand_signals field that's a real
      # numeric gate rather than descriptive-only: reverseSearchSignals (web/logic.js)
      # reads it to turn on the "closer to an existing school is better" reverse-
      # search proxy, reusing the same nearby-schools Overpass read the
      # school-capacity verdict (maybeRenderResVerdict) already fetches — an
      # already-served neighborhood signals real demand for more housing nearby.
      amenities:  { signal: "retail / schools / services already present nearby", prefer_school_within_km: 3 }
      price:      { signal: "achievable price > land + infra + construction cost" }
    induces:
      education: { trigger_per_homes: 1000, note: "~0.5 students/home; flags school headroom" }
      safety:    { trigger_per_homes: 5000, note: "may justify new fire/EMS station" }
      health:    { trigger_per_homes: 20000, note: "supports an urgent-care / clinic" }
      transportation: { note: "trip generation may require road widening" }
    impacts:
      habitat: high          # greenfield subdivisions clear the most oak-juniper
      land_cover: high
      carbon: high           # land-use change + per-capita suburban driving
      water_stress: medium
      traffic: medium
    notes: >
      The canonical SimCity feedback loop AND the chicken-and-egg crux: rooftops
      create the demand that makes retail viable — but developers build rooftops
      only when demand signals (jobs, amenities, absorption) are already present.
      When the amenity they're waiting for is itself waiting for rooftops, you get
      a standoff. See `enabling_edges` below and `simy standoffs`.

  food_truck_court:      # a paved lot of food trucks / mobile vendors, not a building
    label: Food Truck Court / Mobile Vending Site
    requires:
      demand:      { min_households_drive_time: 1500, drive_time_min: 5 }
      parcel:      { min_buildable_acres: 0.25 }
      # Unlike every other use here (which reads "zero competitors = fine, more
      # is worse"), a food truck court wants distance from existing restaurants/
      # vendors, not proximity to demand alone — the closer the nearest
      # fast-food/restaurant, the more it's already saturated. `competition`'s
      # capacity_unit stays the same layer id (no new layer needed — the
      # registry validator only checks `requires` keys name a known layer, not
      # a specific field shape), just a new field on it.
      competition: { min_distance_km_from_nearest: 1.0 }
    induces: {}
    impacts:
      habitat: low
      land_cover: low        # a paved lot, no new building footprint
      carbon: low
      traffic: low
    notes: >
      A much tighter radius than fast_casual — people walk or make a short local
      drive to a food truck court, they don't drive across town for one. The
      site itself barely needs anything (an empty paved lot), so the real gate
      is "far enough from the nearest existing fast-food/restaurant that it
      isn't just eating an existing vendor's lunch crowd."

  ev_charging_hub:       # a small commercial DC fast-charging site, not a building
    label: EV Charging Hub
    requires:
      power:       { prefer_substation_within_km: 3 }
      demand:      { min_households_drive_time: 800, drive_time_min: 5 }
      # Same inverted "farther is better" competition read food_truck_court
      # established: the closer an existing charging station, the more this
      # site is just splitting an already-served crowd rather than opening up
      # a new one.
      competition: { min_distance_km_from_nearest: 0.8 }
    induces: {}
    impacts:
      habitat: low
      land_cover: low         # a handful of charging bays + canopy, not a building pad
      carbon: low              # net-positive for transport emissions, but not modeled here
      traffic: low
    notes: >
      Unlike data_center (which needs a dedicated substation upgrade), a charging
      hub just needs *meaningful nearby grid capacity* — the same
      prefer_substation_within_km field data_center uses, at a much smaller
      radius (3 km vs. data_center's 5 km, since this is a load, not a
      megawatt-scale draw). Nearby rooftops are a documented imperfect proxy
      for "people who can't charge at home" — Overpass doesn't reliably tag
      building=apartments/building:levels everywhere, so the same total-rooftop
      count food_truck_court already uses stands in for it here.

  senior_living:          # assisted-living / nursing-care facility
    label: Senior Living / Assisted-Care Facility
    requires:
      demand:      { min_median_age_years: 40, drive_time_min: 20 }
      parcel:      { min_buildable_acres: 2.5 }
      # Same inverted "farther is better" competition read food_truck_court/
      # ev_charging_hub established: the closer an existing assisted-living or
      # nursing facility, the more this site is splitting an already-served
      # pool of prospective residents rather than opening up a new one.
      competition: { min_distance_km_from_nearest: 3.0 }
    induces: {}
    impacts:
      habitat: low
      land_cover: medium      # a mid-rise building + parking, smaller footprint than a subdivision
      carbon: low
      traffic: low
    notes: >
      Every use above reads demand as "nearby rooftops" (or the same proxy at a
      tighter radius) — a headcount. Senior living is the first to read demand
      as whether the surrounding population *skews older* instead: the
      multi-tract Census ACS trade-area read (`aggregateAcsTracts` in
      web/logic.js) already resolves median age per trade area for
      warehouse_club/fast_casual's due-diligence panel, but nothing had
      consumed it as an actual verdict input until this use.
      min_median_age_years is a documented first-draft heuristic (current US
      median age is ~38-39) — refine freely, same as every other threshold here.

  urgent_care:            # walk-in clinic / urgent-care storefront
    label: Urgent Care / Walk-In Medical Clinic
    requires:
      demand:      { min_households_drive_time: 4000, drive_time_min: 8 }
      parcel:      { min_buildable_acres: 1.0 }
      # Same inverted "farther is better" competition read food_truck_court/
      # ev_charging_hub/senior_living established: a second urgent care two
      # blocks from an existing one splits the same patient pool rather than
      # opening up a new one.
      competition: { min_distance_km_from_nearest: 2.0 }
    induces: {}
    impacts:
      habitat: low
      land_cover: low         # a single-story clinic + small lot, not a big-box footprint
      carbon: low
      traffic: low
    notes: >
      OSM tagging for urgent care is genuinely messy — no single dominant tag
      the way `amenity=charging_station` is unambiguous for EV chargers. The
      live query ORs `amenity=clinic` and `healthcare=clinic`, both known to
      catch real-world false positives (dental offices, vet clinics) — a
      documented best-effort proxy, same honesty as every prior use's
      imperfect demand/competition read. min_households_drive_time is a
      first-draft heuristic (a walk-in clinic serves a wider radius than a
      food truck court but tighter than a warehouse club) — refine freely.

  self_storage:           # multi-building self-storage / mini-storage campus
    label: Self-Storage Facility
    requires:
      demand:      { min_households_drive_time: 2500, drive_time_min: 6 }
      parcel:      { min_buildable_acres: 2.0 }
      # Same inverted "farther is better" competition read food_truck_court/
      # ev_charging_hub/senior_living/urgent_care established: a second
      # storage facility a mile from an existing one is splitting an
      # already-served pool of renters, not opening up a new one.
      competition: { min_distance_km_from_nearest: 1.5 }
    induces: {}
    impacts:
      habitat: low
      land_cover: medium      # a multi-building campus, bigger footprint than a single clinic/food truck lot
      carbon: low
      traffic: low
    notes: >
      OSM tags this reasonably unambiguously as `shop=storage_rental` — used
      as the live competitor/site query, same single-tag confidence as
      `amenity=charging_station` for EV chargers, no OR-fallback needed the
      way urgent_care's messy tagging required. People rent storage close to
      home (moving a spare room's worth of stuff a few blocks, not across
      town), so demand reads nearby rooftops at a tighter radius than
      warehouse_club but wider than food_truck_court — a first-draft
      heuristic, refine freely. min_buildable_acres sits between urgent_care's
      single-clinic lot and warehouse_club's big-box pad, matching a
      multi-building storage campus's actual footprint.

  child_care_center:      # daycare / early-childhood education center
    label: Child Care Center / Daycare
    requires:
      demand:      { min_households_drive_time: 1800, drive_time_min: 6 }
      parcel:      { min_buildable_acres: 0.5 }
      # Same inverted "farther is better" competition read food_truck_court/
      # ev_charging_hub/senior_living/urgent_care/self_storage established: a
      # second daycare a few blocks from an existing one is splitting an
      # already-served pool of families, not opening up a new one.
      competition: { min_distance_km_from_nearest: 1.0 }
    induces: {}
    impacts:
      habitat: low
      land_cover: low          # a single building + a small fenced play yard
      carbon: low
      traffic: low
    notes: >
      People drop kids off close to home or right on a commute route, so
      demand reads nearby rooftops at a radius closer to food_truck_court's
      (1.2 km) than urgent_care's (3 km) — a first-draft heuristic, refine
      freely. min_buildable_acres (0.5) sits below urgent_care's single-
      clinic lot: a daycare building is small, but it needs a fenced outdoor
      play area a clinic doesn't. OSM tags this ambiguously across two live
      tags — `amenity=childcare` and `amenity=kindergarten` — both queried
      independently for the live competitor/site read, same documented
      messy-tagging caveat urgent_care's OR-fallback already set a precedent
      for (kindergarten in OSM often means a standalone early-childhood
      center, not a public-school grade level, but the tag alone can't tell
      the two apart).

  hotel:                  # hotel / extended-stay lodging
    label: Hotel / Extended-Stay Lodging
    requires:
      # Unlike every use above (a rooftop headcount), a hotel's demand is
      # nearby *demand generators* — travelers come for a hospital visit, a
      # business meeting, or an event, not because they live close by. Counted
      # live as nearby hospitals/offices/conference & event venues, same
      # "count of Overpass hits" shape every other `demand` field already
      # uses, just a different set of tags.
      demand:      { min_demand_generators: 15, drive_time_min: 12 }
      # A hotel needs highway/arterial visibility and easy off-ramp access —
      # the first use since warehouse_club/fast_casual to gate on the real
      # AADT traffic-count layer (`AADT_SOURCE` in web/explore.html), at a
      # threshold between fast_casual's arterial bar (20000) and a genuine
      # highway (40000): a hotel wants a busy road, not necessarily an
      # interstate.
      transportation: { near_arterial_aadt: 15000 }
      parcel:      { min_buildable_acres: 1.5 }
      # Same inverted "farther is better" competition read food_truck_court/
      # ev_charging_hub/senior_living/urgent_care/self_storage/
      # child_care_center established: a second hotel a few blocks from an
      # existing one is splitting an already-served pool of travelers, not
      # opening up a new one.
      competition: { min_distance_km_from_nearest: 1.0 }
    induces: {}
    impacts:
      habitat: low
      land_cover: medium      # a multi-story building + a full parking field
      carbon: low
      traffic: medium         # meaningful check-in/checkout and event traffic
    notes: >
      The first use to blend the AADT traffic-count layer into an actual
      verdict (warehouse_club/fast_casual already fetch it, but only
      fast_casual/warehouse_club consumed it before this). min_demand_generators
      (15, within a 5 km radius) and near_arterial_aadt (15000) are first-draft
      heuristics — refine freely, same as every other threshold here. OSM tags
      lodging fairly unambiguously (`tourism=hotel`/`tourism=motel`), so the
      live competitor/site query needs no OR-fallback the way urgent_care's/
      child_care_center's messy tagging required.

  grocery_store:          # grocery store / full-line supermarket
    label: Grocery Store / Supermarket
    requires:
      demand:      { min_households_drive_time: 12000, drive_time_min: 10 }
      parcel:      { min_buildable_acres: 5.0 }
      # Same inverted "farther is better" competition read food_truck_court/
      # ev_charging_hub/senior_living/urgent_care/self_storage/
      # child_care_center/hotel established: a second supermarket a couple
      # miles from an existing one is splitting an already-served grocery
      # trade area, not opening up a new one.
      competition: { min_distance_km_from_nearest: 2.0 }
    induces: {}
    impacts:
      habitat: low
      land_cover: medium      # a mid-box building + a full parking field
      carbon: low
      traffic: medium         # steady daily trip generation, a real anchor-tenant draw
    notes: >
      A rooftop-headcount demand read like warehouse_club/fast_casual, at a
      radius (8 km) between the two — a supermarket's trade area is wider
      than a fast-casual restaurant's walk-up/short-drive crowd but far
      tighter than a warehouse club's citywide draw. min_households_drive_time
      (12000) and min_buildable_acres (5.0, a mid-box anchor + parking field,
      smaller than warehouse_club's 15-acre big-box pad) are first-draft
      heuristics — refine freely, same as every other threshold here. This is
      the first new land use to be wired up using `standardUseVerdict` (web/
      logic.js, "Best fit here" step 1's shared demand+site-size+competitor-
      distance core) directly instead of duplicating that three-gate math
      inline, since its requires shape is exactly what that helper models:
      a rooftop-need ratio, an acreage floor, and a farther-is-better
      competitor-distance floor. OSM tags this unambiguously (`shop=
      supermarket`), so the live competitor/site query needs no OR-fallback.

  car_wash:               # automated/tunnel or self-serve car wash
    label: Car Wash
    requires:
      demand:      { min_households_drive_time: 7000, drive_time_min: 8 }
      # A car wash lives and dies on drive-by visibility/volume even more than
      # warehouse_club does — reuses the same `minAadt` gate mechanism
      # (`standardUseVerdict`'s AADT leg, web/logic.js) warehouse_club/
      # fast_casual/hotel already established, at a threshold between
      # fast_casual's arterial bar (20000) and warehouse_club's highway bar
      # (40000): a wash tunnel wants a busy arterial, not necessarily
      # interstate frontage.
      transportation: { near_arterial_aadt: 25000 }
      parcel:      { min_buildable_acres: 1.0 }
      # Same inverted "farther is better" competition read food_truck_court/
      # ev_charging_hub/senior_living/urgent_care/self_storage/
      # child_care_center/hotel/grocery_store established: a second car wash
      # a mile from an existing one is splitting an already-served pool of
      # drivers, not opening up a new one.
      competition: { min_distance_km_from_nearest: 1.5 }
    induces: {}
    impacts:
      habitat: low
      land_cover: low         # a wash tunnel/bays + stacking lanes, well under a big-box footprint
      carbon: low
      traffic: low
    notes: >
      A rooftop-headcount demand read like fast_casual, at a slightly
      tighter radius (5 km) — a car wash draws a local/commute-route crowd,
      not a citywide one. min_households_drive_time (7000),
      min_buildable_acres (1.0, a wash tunnel + stacking lanes, well under
      warehouse_club's 15-acre big-box pad), and near_arterial_aadt (25000)
      are first-draft heuristics — refine freely, same as every other
      threshold here. Wired up via `standardUseVerdict` directly (same
      demand+site-size+AADT+competitor-distance shape grocery_store/hotel
      already established), no new gate-shape work needed. OSM tags this
      with two live tags — `shop=car_wash` and `amenity=car_wash` — both
      queried with an OR-fallback for the live competitor/site read, same
      messy-tagging caveat urgent_care/child_care_center already documented.

  pharmacy:               # pharmacy / drugstore (CVS/Walgreens-type)
    label: Pharmacy / Drugstore
    requires:
      demand:      { min_households_drive_time: 8000, drive_time_min: 8 }
      # A drugstore wants visible arterial frontage even more than a car wash
      # does — same `minAadt` gate mechanism (`standardUseVerdict`'s AADT
      # leg, web/logic.js) car_wash/warehouse_club/fast_casual/hotel already
      # established, at car_wash's own threshold: a busy arterial, not
      # necessarily interstate frontage.
      transportation: { near_arterial_aadt: 25000 }
      parcel:      { min_buildable_acres: 1.5 }
      # Same inverted "farther is better" competition read food_truck_court/
      # ev_charging_hub/senior_living/urgent_care/self_storage/
      # child_care_center/hotel/grocery_store/car_wash established: a second
      # drugstore a kilometer from an existing one (the CVS-across-from-
      # Walgreens saturation pattern) is splitting an already-served pool of
      # customers, not opening up a new one.
      competition: { min_distance_km_from_nearest: 1.0 }
    induces: {}
    impacts:
      habitat: low
      land_cover: low         # a small pad site + parking, well under a big-box footprint
      carbon: low
      traffic: low
    notes: >
      A rooftop-headcount demand read like car_wash, at a slightly wider
      radius (6 km) — a drugstore draws a bit more of a citywide/commute-route
      crowd than a car wash's purely local base. min_households_drive_time
      (8000), min_buildable_acres (1.5, a small pad site, not a big-box lot),
      near_arterial_aadt (25000), and min_distance_km_from_nearest (1.0) are
      first-draft heuristics — refine freely, same as every other threshold
      here. Wired up via `standardUseVerdict` directly (same demand+site-
      size+AADT+competitor-distance shape car_wash/grocery_store already
      established), no new gate-shape work needed. OSM tags this with three
      live tags — `shop=chemist`, `amenity=pharmacy`, and `healthcare=
      pharmacy` — all queried with an OR-fallback for the live competitor/
      site read, same messy-tagging caveat urgent_care/child_care_center/
      car_wash already documented.

# -----------------------------------------------------------------------------
# ENABLING EDGES — directed "X makes Y more viable" relationships between land
# uses. These are what create chicken-and-egg standoffs: when a set of *absent*
# uses forms a cycle, each is waiting on another and nobody moves first. The
# standoff detector (simy_city/standoffs.py, `simy standoffs`) finds these cycles
# and reports the breaker — the cheapest edge a public actor could subsidize to
# unstick the loop.
#
#   from   the use whose presence/growth provides the signal
#   to     the use that becomes more viable as a result
#   via    the mechanism (the demand_signal or layer it satisfies)
#   breaker_cost  rough relative cost for a public actor to supply `via` directly
#                 (low/medium/high) — used to suggest where to break a standoff
# -----------------------------------------------------------------------------
enabling_edges:
  - { from: residential_subdivision, to: warehouse_club, via: "rooftops / household count in trade area", breaker_cost: high }
  - { from: residential_subdivision, to: fast_casual,    via: "resident + daytime demand", breaker_cost: high }
  - { from: warehouse_club, to: residential_subdivision, via: "retail amenity raises home absorption & price", breaker_cost: medium }
  - { from: fast_casual,    to: residential_subdivision, via: "amenity raises home absorption", breaker_cost: low }
  - { from: employment_center, to: residential_subdivision, via: "jobs create housing demand (absorption)", breaker_cost: high }
  - { from: residential_subdivision, to: employment_center, via: "labor pool attracts employers", breaker_cost: high }
  - { from: broadband_buildout, to: residential_subdivision, via: "service availability unblocks development", breaker_cost: medium }
  - { from: broadband_buildout, to: data_center, via: "redundant fiber is a hard data-center gate", breaker_cost: medium }
  - { from: residential_subdivision, to: broadband_buildout, via: "rooftop density makes ISP buildout profitable", breaker_cost: medium }

# Lightweight "actor" uses referenced by enabling_edges that aren't full
# drop-on-a-parcel developments but matter for standoff reasoning. Kept minimal
# on purpose; promote to full land_uses entries when we model them in depth.
actor_uses:
  employment_center:
    label: Employment Center (office / industrial jobs)
    note: "A jobs anchor. Often the public-incentive lever that breaks a housing/retail standoff."
  broadband_buildout:
    label: Broadband Buildout (ISP investment)
    note: "Private ISP capital expansion; gated by rooftop density, so itself part of standoffs."

# -----------------------------------------------------------------------------
# STAKEHOLDERS — the "should we develop?" question has no single answer; it has
# competing answers. Each stakeholder weighs the same parcel differently. The
# perspectives engine (simy_city/perspectives.py, `simy perspectives <use>`)
# scores a land use through every lens so the *tension* is explicit rather than
# collapsed into one verdict. SIMyCity's job is to show the trade-off, not to
# pick a winner.
#
#   opposes_impacts   impact dimensions (on a use's `impacts` block) this
#                     stakeholder counts against the project; higher severity = worse
#   opposes_structure structural costs: currently "induces" = each induced public
#                     service is a burden this stakeholder bears
#   pro_build         baseline lean toward building (gated by market data at M1)
#   amenity_seeker    credits uses that are themselves amenities (retail/services)
# -----------------------------------------------------------------------------
stakeholders:
  developer:
    label: Developer
    question: "Will this make money?"
    pro_build: true
    opposes_impacts: []
    note: "Structurally pro-build; the real leaning is gated by market/absorption data (M1)."
  resident:
    label: Existing Resident
    question: "Does this improve daily life without ruining the area?"
    amenity_seeker: true
    opposes_impacts: [traffic, land_cover]
    note: "Wants amenities and services nearby, but not the traffic and sprawl that come with them."
  environmentalist:
    label: Environmentalist
    question: "What does this destroy or emit?"
    opposes_impacts: [habitat, land_cover, carbon, water_stress]
    note: "Weighs habitat loss, impervious cover, carbon, and water stress against any built benefit."
  municipality:
    label: Municipality / Taxpayer
    question: "Does the tax base cover the public services it triggers?"
    pro_build: true
    opposes_structure: [induces]
    note: "Welcomes tax base but bears the cost of every induced school, fire station, and road."
